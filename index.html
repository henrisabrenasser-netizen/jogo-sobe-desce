<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cobrinha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap">
<style>
  /* Layout: uma coluna centralizada; placar em cima, campo quadriculado, dicas embaixo. */
  :root {
    --bg: #e8efd9;
    --panel: #4a7c3a;
    --panel-ink: #f4f9ec;
    --ink: #24361d;
    --muted: #5b6e50;
    --accent: #e8483f;
    --overlay: rgba(28, 46, 22, 0.72);
    --grass-a: #a9d46b;
    --grass-b: #a0cc62;
    --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17221a; --panel: #2f5527; --panel-ink: #eaf5dc; --ink: #e2ecd6; --muted: #9fb393;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17221a; --panel: #2f5527; --panel-ink: #eaf5dc; --ink: #e2ecd6; --muted: #9fb393;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px;
    box-sizing: border-box;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .bar {
    background: var(--panel);
    color: var(--panel-ink);
    border-radius: 14px 14px 4px 4px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.6rem;
    line-height: 1;
    letter-spacing: 0.01em;
  }
  .scores { display: flex; gap: 18px; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
  .scores span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .scores small { font-family: var(--font-body); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.8; }
  .board {
    position: relative;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 17 / 15;
    border-radius: 4px 4px 14px 14px;
    overflow: hidden;
    box-shadow: 0 0 0 6px var(--panel);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .overlay {
    position: absolute;
    inset: 0;
    background: var(--overlay);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 16px;
  }
  .overlay h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.8rem, 7vw, 2.6rem); line-height: 1; }
  .overlay p { margin: 0; max-width: 32ch; line-height: 1.4; }
  button {
    font: 800 1.1rem var(--font-display);
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 999px;
    padding: 10px 26px;
    cursor: pointer;
    box-shadow: 0 4px 0 #a92c25;
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #a92c25; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .hint { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; text-align: center; line-height: 1.5; }
  kbd {
    font-family: var(--font-body);
    font-weight: 700;
    border: 1px solid currentColor;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="bar">
    <h1>Cobrinha</h1>
    <div class="scores" aria-live="polite">
      <span><small>Pontos</small> <b id="score">0</b></span>
      <span><small>Recorde</small> <b id="best">0</b></span>
    </div>
  </header>
  <div class="board">
    <canvas id="game" aria-label="Campo do jogo da cobrinha"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Cobrinha</h2>
      <p id="ovText">Use as setinhas do teclado para guiar a cobra. Coma as frutas para crescer e não bata nas paredes nem em si mesma.</p>
      <button id="startBtn" type="button">Jogar</button>
    </div>
  </div>
  <p class="hint"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> para mover · <kbd>Espaço</kbd> para pausar · no celular, deslize o dedo</p>
</main>

<script>
(() => {
  const COLS = 17, ROWS = 15;
  const TICK_MS = 130;            // velocidade da cobra
  const FRUIT_EVERY_MS = 6000;    // uma fruta nova nasce a cada 6 s
  const MAX_FRUITS = 3;
  const FRUIT_COLORS = ["#e8483f", "#e8483f", "#f39a1e", "#8e4fc9"]; // maçã (mais comum), laranja, uva

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovText = document.getElementById("ovText");
  const startBtn = document.getElementById("startBtn");

  let best = 0;
  try { best = Number(localStorage.getItem("cobrinha-recorde")) || 0; } catch (e) {}
  bestEl.textContent = best;

  let snake, dir, queue, fruits, score, state, lastTick, lastFruit, cell;
  // state: "ready" | "playing" | "paused" | "over"

  function reset() {
    const y = Math.floor(ROWS / 2);
    snake = [{ x: 5, y }, { x: 4, y }, { x: 3, y }];
    dir = { x: 1, y: 0 };
    queue = [];
    fruits = [];
    score = 0;
    scoreEl.textContent = 0;
    spawnFruit();
  }

  function freeCells() {
    const taken = new Set(snake.map(p => p.x + "," + p.y));
    fruits.forEach(f => taken.add(f.x + "," + f.y));
    const free = [];
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++)
      if (!taken.has(x + "," + y)) free.push({ x, y });
    return free;
  }

  function spawnFruit() {
    const free = freeCells();
    if (!free.length) return;
    const p = free[Math.floor(Math.random() * free.length)];
    p.color = FRUIT_COLORS[Math.floor(Math.random() * FRUIT_COLORS.length)];
    p.born = performance.now();
    fruits.push(p);
  }

  function setDirection(nx, ny) {
    if (state === "ready" || state === "over") return;
    if (state === "paused") state = "playing", hideOverlay();
    // compara com a última direção da fila, para não virar 180° com dois toques rápidos
    const last = queue.length ? queue[queue.length - 1] : dir;
    if ((nx === -last.x && ny === -last.y) || (nx === last.x && ny === last.y)) return;
    if (queue.length < 3) queue.push({ x: nx, y: ny });
  }

  function step(now) {
    if (queue.length) dir = queue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // parede
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) return gameOver();

    const fi = fruits.findIndex(f => f.x === head.x && f.y === head.y);
    const grows = fi !== -1;
    // em si mesma (a ponta do rabo sai do lugar se a cobra não estiver crescendo)
    const body = grows ? snake : snake.slice(0, -1);
    if (body.some(p => p.x === head.x && p.y === head.y)) return gameOver();

    snake.unshift(head);
    if (grows) {
      fruits.splice(fi, 1);
      score++;
      scoreEl.textContent = score;
      if (!fruits.length) { spawnFruit(); lastFruit = now; }
    } else {
      snake.pop();
    }

    if (now - lastFruit >= FRUIT_EVERY_MS) {
      if (fruits.length < MAX_FRUITS) spawnFruit();
      lastFruit = now;
    }
  }

  function gameOver() {
    state = "over";
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem("cobrinha-recorde", String(best)); } catch (e) {}
    }
    showOverlay("Fim de jogo!", `Você fez ${score} ${score === 1 ? "ponto" : "pontos"}. Aperte Enter ou o botão para recomeçar.`, "Jogar de novo");
  }

  function start() {
    reset();
    state = "playing";
    lastTick = lastFruit = performance.now();
    hideOverlay();
    canvas.focus?.();
  }

  function togglePause() {
    if (state === "playing") {
      state = "paused";
      showOverlay("Pausado", "Aperte Espaço ou uma setinha para continuar.", "Continuar");
    } else if (state === "paused") {
      state = "playing";
      lastTick = performance.now();
      hideOverlay();
    }
  }

  function showOverlay(title, text, btn) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    startBtn.textContent = btn;
    overlay.hidden = false;
    startBtn.focus();
  }
  function hideOverlay() { overlay.hidden = true; }

  // ---------- desenho ----------
  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    cell = canvas.width / COLS;
    draw(performance.now());
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawField() {
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) {
      ctx.fillStyle = (x + y) % 2 ? "#a0cc62" : "#a9d46b";
      ctx.fillRect(x * cell, y * cell, cell + 1, cell + 1);
    }
  }

  function drawFruit(f, now) {
    const age = Math.min(1, (now - f.born) / 220);
    const s = cell * (0.36 + 0.02 * Math.sin(now / 250 + f.x)) * Math.max(0.05, age);
    const cx = f.x * cell + cell / 2, cy = f.y * cell + cell / 2 + cell * 0.04;
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.beginPath(); ctx.ellipse(cx, cy + s * 0.9, s * 0.8, s * 0.25, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.arc(cx, cy, s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.beginPath(); ctx.arc(cx - s * 0.35, cy - s * 0.35, s * 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#5b3a1a"; ctx.lineWidth = cell * 0.07; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(cx, cy - s * 0.85); ctx.lineTo(cx + s * 0.15, cy - s * 1.35); ctx.stroke();
    ctx.fillStyle = "#3f8f2f";
    ctx.beginPath(); ctx.ellipse(cx + s * 0.45, cy - s * 1.15, s * 0.32, s * 0.16, -0.5, 0, Math.PI * 2); ctx.fill();
  }

  function drawSnake() {
    const pad = cell * 0.08;
    for (let i = snake.length - 1; i >= 0; i--) {
      const p = snake[i];
      const t = i / Math.max(1, snake.length - 1);
      // corpo vai clareando do pescoço até o rabo
      const l = 48 + t * 14;
      ctx.fillStyle = `hsl(224, 72%, ${l}%)`;
      roundRect(p.x * cell + pad, p.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.28);
      ctx.fill();
      // emenda entre os gomos, para a cobra parecer contínua
      const n = snake[i - 1];
      if (n) {
        const mx = Math.min(p.x, n.x), my = Math.min(p.y, n.y);
        const w = Math.abs(p.x - n.x) * cell, h = Math.abs(p.y - n.y) * cell;
        ctx.fillRect(mx * cell + (w ? cell / 2 : pad), my * cell + (h ? cell / 2 : pad),
                     w ? w : cell - pad * 2, h ? h : cell - pad * 2);
      }
    }
    // olhos
    const h = snake[0];
    const cx = h.x * cell + cell / 2, cy = h.y * cell + cell / 2;
    const fx = dir.x, fy = dir.y;
    const ox = -fy, oy = fx; // perpendicular
    for (const side of [-1, 1]) {
      const ex = cx + fx * cell * 0.12 + ox * side * cell * 0.2;
      const ey = cy + fy * cell * 0.12 + oy * side * cell * 0.2;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(ex, ey, cell * 0.14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#1b1f3a";
      ctx.beginPath(); ctx.arc(ex + fx * cell * 0.05, ey + fy * cell * 0.05, cell * 0.07, 0, Math.PI * 2); ctx.fill();
    }
  }

  function draw(now) {
    if (!cell) return;
    drawField();
    fruits.forEach(f => drawFruit(f, now));
    drawSnake();
  }

  function loop(now) {
    if (state === "playing") {
      while (now - lastTick >= TICK_MS && state === "playing") {
        lastTick += TICK_MS;
        step(now);
      }
    }
    draw(now);
    requestAnimationFrame(loop);
  }

  // ---------- controles ----------
  const KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
  };
  window.addEventListener("keydown", e => {
    if (KEYS[e.key]) {
      e.preventDefault();
      setDirection(...KEYS[e.key]);
    } else if (e.key === " ") {
      e.preventDefault();
      if (state === "ready" || state === "over") start(); else togglePause();
    } else if (e.key === "Enter" && (state === "ready" || state === "over")) {
      e.preventDefault();
      start();
    }
  });

  startBtn.addEventListener("click", () => (state === "paused" ? togglePause() : start()));

  let touch = null;
  canvas.addEventListener("pointerdown", e => { touch = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener("pointerup", e => {
    if (!touch) return;
    const dx = e.clientX - touch.x, dy = e.clientY - touch.y;
    touch = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDirection(Math.sign(dx), 0);
    else setDirection(0, Math.sign(dy));
  });

  window.addEventListener("resize", resize);
  reset();
  state = "ready";
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
